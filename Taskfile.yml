version: "3"

vars:
  PROJECT_NAME: ErrorBrain
  API_DIR: api
  SDK_PYTHON_DIR: sdk-python
  SDK_GO_DIR: sdk-go
  TERRAFORM_DIR: terraform-provider

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  install:
    desc: Install all dependencies
    cmds:
      - echo "📦 Setting up Python..."
      - cd {{.API_DIR}} && uv sync --all-extras
      - cd {{.SDK_PYTHON_DIR}} && uv sync --all-extras
      - echo "📦 Setting up Go..."
      - cd {{.SDK_GO_DIR}} && go mod download || true
      - cd {{.TERRAFORM_DIR}} && go mod download || true
      - echo "✨ Setup complete!"

  install-api:
    desc: Install API dependencies only
    cmds:
      - cd {{.API_DIR}} && uv sync --all-extras

  install-sdk-python:
    desc: Install Python SDK dependencies only
    cmds:
      - cd {{.SDK_PYTHON_DIR}} && uv sync --all-extras

  install-sdk-go:
    desc: Install Go SDK dependencies only
    cmds:
      - cd {{.SDK_GO_DIR}} && go mod download

  test:
    desc: Run all SDK tests
    cmds:
      - echo "🧪 Testing Python..."
      - cd {{.API_DIR}} && uv run pytest tests/ -v || true
      - cd {{.SDK_PYTHON_DIR}} && uv run pytest tests/ -v || true
      - echo "🧪 Testing Go..."
      - cd {{.SDK_GO_DIR}} && go test -v ./... || true
      - echo "✓ All tests completed!"

  test-api:
    desc: Run API tests
    cmds:
      - echo "Testing API..."
      - cd {{.API_DIR}} && uv run pytest tests/ -v

  test-sdk-go:
    desc: Run Go SDK tests
    cmds:
      - echo "Testing Go SDK..."
      - cd {{.SDK_GO_DIR}} && go test -v ./...

  test-coverage:
    desc: Run tests with coverage
    cmds:
      - echo "Running API tests with coverage..."
      - cd {{.API_DIR}} && uv run pytest tests/ -v --cov=src --cov-report=html --cov-report=term
      - echo "Coverage report {{.API_DIR}}/htmlcov/index.html"

  lint:
    desc: Run linters on all code
    cmds:
      - task: lint-api
      - task: lint-sdk-python
      - task: lint-sdk-go
      - echo "✓ All lints passed!"

  lint-api:
    desc: Lint API code
    cmds:
      - echo "Linting API..."
      - cd {{.API_DIR}} && uv run ruff check src/
      - cd {{.API_DIR}} && uv run mypy src/

  lint-sdk-python:
    desc: Lint Python SDK
    cmds:
      - echo "Linting Python SDK..."
      - cd {{.SDK_PYTHON_DIR}} && uv run ruff check src/
      - cd {{.SDK_PYTHON_DIR}} && uv run mypy src/

  lint-sdk-go:
    desc: Lint Go SDK
    cmds:
      - echo "Linting Go SDK..."
      - cd {{.SDK_GO_DIR}} && golangci-lint run

  format:
    desc: Format all code
    cmds:
      - echo "🎨 Formatting Python..."
      - cd {{.API_DIR}} && uv run ruff format src/ tests/ || true
      - cd {{.SDK_PYTHON_DIR}} && uv run ruff format src/ || true
      - echo "🎨 Formatting Go..."
      - cd {{.SDK_GO_DIR}} && go fmt ./... || true
      - cd {{.TERRAFORM_DIR}} && go fmt ./... || true
      - echo "✓ Formatting complete!"

  format-python:
    desc: Format Python code
    cmds:
      - echo "Formatting Python code..."
      - cd {{.API_DIR}} && uv run ruff format src/ tests/
      - cd {{.SDK_PYTHON_DIR}} && uv run ruff format src/

  format-go:
    desc: Format Go code
    cmds:
      - echo "Formatting Go code..."
      - cd {{.SDK_GO_DIR}} && go fmt ./...
      - cd {{.TERRAFORM_DIR}} && go fmt ./...

  clean:
    desc: Clean build artifacts
    cmds:
      - echo "Cleaning build artifacts..."
      - find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
      - find . -type d -name ".pytest_cache" -exec rm -rf {} + 2>/dev/null || true
      - find . -type d -name ".ruff_cache" -exec rm -rf {} + 2>/dev/null || true
      - find . -type d -name ".mypy_cache" -exec rm -rf {} + 2>/dev/null || true
      - find . -type d -name "htmlcov" -exec rm -rf {} + 2>/dev/null || true
      - find . -type d -name "_build" -exec rm -rf {} + 2>/dev/null || true
      - find . -type f -name "*.pyc" -delete
      - find . -type f -name ".coverage" -delete
      - echo "✓ Clean complete!"

  dev:
    desc: Start development API server
    cmds:
      - echo "Starting API server..."
      - test -f {{.API_DIR}}/.env || (echo "⚠️  .env not found. Copy from .env.example:" && echo "  cp {{.API_DIR}}/.env.example {{.API_DIR}}/.env" && exit 1)
      - cd {{.API_DIR}} && uv run uvicorn errorbrain_server.main:app --reload --host 0.0.0.0 --port 8000

  health:
    desc: Check if API is running and healthy
    cmds:
      - |
        API_URL="${1:-http://localhost:8000}"
        if ! command -v curl &> /dev/null; then
          echo "❌ curl not found"
          exit 1
        fi
        echo "🏥 Checking API health at $API_URL..."
        if RESPONSE=$(curl -s "$API_URL/health"); then
          echo "✅ API is running"
          echo "$RESPONSE" | jq . || echo "$RESPONSE"
        else
          echo "❌ API is not responding"
          exit 1
        fi

  dev-watch:
    desc: Start API with auto-reload
    cmds:
      - cd {{.API_DIR}} && uv run uvicorn errorbrain_server.main:app --reload --host 0.0.0.0 --port 8000

  build-terraform:
    desc: Build Terraform provider
    cmds:
      - cd {{.TERRAFORM_DIR}} && go build -o terraform-errorbrain

  docs:
    desc: Build all documentation
    cmds:
      - task: docs-api
      - task: docs-sdk-python
      - task: docs-sdk-go-info

  docs-api:
    desc: Build API documentation
    cmds:
      - echo "Building API documentation..."
      - cd {{.API_DIR}}/docs && uv run sphinx-build -b html . _build/html
      - echo "✓ API docs {{.API_DIR}}/docs/_build/html/index.html"

  docs-sdk-python:
    desc: Build Python SDK documentation
    cmds:
      - echo "Building Python SDK documentation..."
      - cd {{.SDK_PYTHON_DIR}}/docs && uv run sphinx-build -b html . _build/html
      - echo "✓ SDK docs {{.SDK_PYTHON_DIR}}/docs/_build/html/index.html"

  docs-sdk-go:
    desc: Start godoc server for Go SDK
    cmds:
      - echo "Starting godoc server..."
      - cd {{.SDK_GO_DIR}} && godoc -http=:6060

  docs-sdk-go-info:
    desc: Show Go SDK documentation info
    cmds:
      - echo "Go SDK documentation:"
      - echo "  Local - godoc -http=:6060 (then visit http://localhost:6060/pkg/github.com/afeldman/errorbrain/sdk-go/)"
      - echo "  Online - https://pkg.go.dev/github.com/afeldman/errorbrain/sdk-go"

  docs-open:
    desc: Open documentation in browser
    cmds:
      - open {{.API_DIR}}/docs/_build/html/index.html
      - open {{.SDK_PYTHON_DIR}}/docs/_build/html/index.html

  git-hooks:
    desc: Install pre-commit hooks
    cmds:
      - pip install pre-commit
      - pre-commit install
      - echo "✓ Git hooks installed!"

  check:
    desc: Run all checks (format, lint, test)
    cmds:
      - task: format
      - task: lint
      - task: test
      - echo "✨ All checks passed!"

  examples-python:
    desc: Run Python example
    cmds:
      - cd examples && python python_example.py

  examples-go:
    desc: Run Go example
    cmds:
      - cd examples && go run go_example.go

  examples-terraform:
    desc: Show Terraform example
    cmds:
      - cat examples/terraform_example.tf

  # === Docker Tasks ===
  docker:build:
    desc: Build Docker image for API
    cmds:
      - echo "🐳 Building Docker image..."
      - docker build -t errorbrain-api:latest ./api
      - echo "✓ Docker image built!"

  docker:run:
    desc: Run API in Docker container
    cmds:
      - docker run -d --name errorbrain-api -p 8000:8000 \
        -e ERRORBRAIN_OBSIDIAN_ENABLED=true \
        -e ERRORBRAIN_LLM_BASE_URL=http://host.docker.internal:1234/v1 \
        errorbrain-api:latest
      - echo "✓ Container running at http://localhost:8000"

  docker:stop:
    desc: Stop Docker container
    cmds:
      - docker stop errorbrain-api || true
      - docker rm errorbrain-api || true
      - echo "✓ Container stopped"

  docker:logs:
    desc: View Docker container logs
    cmds:
      - docker logs -f errorbrain-api

  docker:compose:up:
    desc: Start API with docker-compose
    cmds:
      - docker-compose up -d
      - echo "✓ Services running (docker-compose)"

  docker:compose:down:
    desc: Stop docker-compose services
    cmds:
      - docker-compose down
      - echo "✓ Services stopped"

  docker:compose:logs:
    desc: View docker-compose logs
    cmds:
      - docker-compose logs -f
