name: Go SDK CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Go Mod Tidy and Verify
        working-directory: sdk-go
        run: |
          go mod tidy
          go mod verify

      - name: Build
        working-directory: sdk-go
        run: go build -v ./...

      - name: Test
        working-directory: sdk-go
        run: go test -v ./...

