replicaCount: 1

image:
  repository: errorbrain
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

env:
  ERRORBRAIN_REASONING_MODE: rules
  # LLM_HOST: "http://127.0.0.1:1234/v1"
  # LLM_MODEL: "mistralai/ministral-3-3b"
  # LLM_KEY: "not-required-for-local"

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}

persistence:
  enabled: false
  accessMode: ReadWriteOnce
  size: 1Gi
  mountPath: /data/obsidian
