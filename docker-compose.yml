version: "3.9"

services:
  errorbrain:
    image: errorbrain:latest
    container_name: errorbrain
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      LOG_LEVEL: info
      ERRORBRAIN_REASONING_MODE: rules
      LLM_HOST: http://127.0.0.1:1234/v1
      LLM_MODEL: mistralai/ministral-3-3b
      LLM_KEY: not-required-for-local
    volumes:
      # Output-Verzeichnis für Obsidian-Markdown (Second Brain)
      # Dieses Volume wird vom Host bereitgestellt und ist KEIN Bestandteil des Docker-Images.
      - ./obsidian-vault:/data/obsidian
    restart: unless-stopped
